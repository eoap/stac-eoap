site_name: STAC for input/output data management in EO applications

theme:
    logo: assets/icon-eoap.png
    name: material

    palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
plugins:
  - search

markdown_extensions:
  - pymdownx.details
  - abbr
  - admonition
  - footnotes
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - attr_list
  - pymdownx.snippets:
      base_path: './'
  - pymdownx.highlight:
      line_spans: __span

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js


nav:
  - Introduction: 'index.md'
  - Quickstart: 'quickstart.md'
  - Data flow management:
    - Definitions: 'definitions.md'
    - Application data flow: 'application-data-flow.md'
    - Platform data flow: 'platform-data-flow.md'
  - Hands-on: 'hands-on.md'
  - CWL reference: 'cwl-reference.md'
  - Troubleshooting: 'troubleshooting.md'
  - Validation and maintenance: 'validation.md'

copyright: <a href="https://img.shields.io/badge/License-CC_BY--SA_4.0-lightgrey.svg">License CC BY-SA 4.0</a>, by <a href="https://creativecommons.org/licenses/by-sa/4.0/">Creative Commons</a>
