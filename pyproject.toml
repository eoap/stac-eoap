[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stac-eoap"
dynamic = ["version"]
description = "Understanding STAC for input/output data modelling in Earth Observation Applications"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "CC-BY-SA-4.0"
keywords = []
classifiers = ["Development Status :: 4 - Beta", "Environment :: Console", "Intended Audience :: Developers", "Programming Language :: Python", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy"]
dependencies = []

[[project.authors]]
name = "Fabrice Brito"
email = "fabrice.brito@terradue.com"

[project.urls]
Documentation = "https://github.com/eoap/stac-eoap#readme"
Issues = "https://github.com/eoap/stac-eoap/issues"
Source = "https://github.com/eoap/stac-eoap"

[tool.hatch.version]
path = "__about__.py"

[tool.hatch.envs.default]
skip-install = false
template = "dev"
pre-install-commands = ["uv pip install --require-hashes -r requirements/development.txt"]
post-install-commands = ["uv pip install --no-deps --no-build-isolation -e ."]

[tool.hatch.envs.default.scripts]
cwl-docs = "python scripts/cwl-docs.py {args}"

[tool.hatch.envs.docs.scripts]
serve = "mkdocs serve"
deploy = "mkdocs gh-deploy --force"

[tool.hatch.envs.dev]
template = "dev"
python = "3.12"
skip-install = true
installer = "uv"
post-install-commands = ["uv pip install --require-hashes -r requirements/development.txt", "uv pip install --no-deps --no-build-isolation -e ."]

[tool.hatch.envs.dev.scripts]
bootstrap = ["uv pip install --require-hashes -r requirements/development.txt", "uv pip install --no-deps --no-build-isolation -e ."]
check = ["bootstrap", "format-check", "lint-check", "typecheck", "security"]
format-check = "ruff format --check stac_eoap scripts"
lint-check = "ruff check stac_eoap scripts"
typecheck = "mypy stac_eoap scripts"
security = "bandit -r stac_eoap scripts -ll"

[tool.hatch.envs.test]
template = "dev"

[tool.hatch.envs.test.scripts]
test = ["bootstrap", "python scripts/cwl-docs.py --validate {args}"]

[tool.hatch.build.targets.wheel]
packages = ["stac_eoap"]

[tool.hatch.build.targets.sdist]
include = ["/stac_eoap", "/__about__.py", "/pyproject.toml", "/README.md", "/LICENSE", "/scripts", "/notebooks", "/requirements", "/typing"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
ignore_missing_imports = true
strict = true
mypy_path = "typing"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
